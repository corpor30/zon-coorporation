        privacy: {
            title: 'Privacy Policy',
            updated: 'October 2026',
            html: `
                <p>This Privacy Policy explains how Zon Corporation Rwanda Limited collects, uses, and protects your personal information, in compliance with <strong>Law No. 058/2021 of 13/10/2021</strong> relating to the protection of personal data and privacy in Rwanda.</p>

                <p>We use industry-standard safeguards including HTTPS encryption, access controls, and secure database storage. No method of transmission is 100% secure; we cannot guarantee absolute security.</p>

                <h2>11. Contact</h2>
                <p>For privacy questions: <a href="mailto:contact@zoncorp.rw">contact@zoncorp.rw</a> · +250 790 696 865</p>

            html: `

                <h2>9. Contact</h2>
                <p>Phone: +250 790 696 865 · Email: <a href="mailto:contact@zoncorp.rw">contact@zoncorp.rw</a></p>

                    <li><strong>Kigali:</strong> Same-day delivery for orders placed before 3:00 PM</li>
                    <li><strong>Outside Kigali:</strong> 1–2 business days</li>

                <h2>2. Delivery Fees</h2>

                    <li><strong>Outside Kigali:</strong> 5,000 RWF</li>

    // Read ?doc= parameter
    const params = new URLSearchParams(window.location.search);
    const docSlug = params.get('doc') || 'terms';
    const doc = LEGAL_DOCS[docSlug];

    const container = document.getElementById('legal-content');

    if (!doc) {
        container.innerHTML = '<h1>Document not found</h1><p><a href="legal.html?doc=terms">Go to Terms of Service</a></p>';
    } else {
        document.title = doc.title + ' — Zon Corporation Rwanda';
        container.innerHTML = `
            <div class="mb-10">
                <span class="text-xs font-bold tracking-[0.25em] uppercase text-[var(--zon-primary)]">Legal</span>
                <h1 class="text-4xl md:text-5xl font-bold mt-3 mb-2" style="font-family: var(--font-display);">${doc.title}</h1>
                <p class="text-sm text-gray-500">Last updated: ${doc.updated}</p>
            </div>
            <div class="legal-body">${doc.html}</div>
        `;
    }
    </script>
